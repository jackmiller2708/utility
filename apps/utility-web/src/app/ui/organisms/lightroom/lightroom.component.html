@if (showToggle()) {
  <div class="relative z-10 flex items-center gap-1 mb-5" role="tablist">
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="activeSide() === 'original'"
      (click)="selectSide('original')"
      [class.bg-riso-pink-pooled]="activeSide() === 'original'"
      [class.text-press-text]="activeSide() === 'original'"
      [class.font-bold]="activeSide() === 'original'"
      [class.text-press-text-muted]="activeSide() !== 'original'"
      [class.hover:text-press-text]="activeSide() !== 'original'"
      class="px-3 py-1.5 rounded-sm text-xs font-mono tracking-[0.04em] transition-colors duration-shift ease-run cursor-pointer active:opacity-60"
    >
      ORIGINAL
    </button>
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="activeSide() === 'export'"
      (click)="selectSide('export')"
      [class.bg-riso-pink-pooled]="activeSide() === 'export'"
      [class.text-press-text]="activeSide() === 'export'"
      [class.font-bold]="activeSide() === 'export'"
      [class.text-press-text-muted]="activeSide() !== 'export'"
      [class.hover:text-press-text]="activeSide() !== 'export'"
      class="px-3 py-1.5 rounded-sm text-xs font-mono tracking-[0.04em] transition-colors duration-shift ease-run cursor-pointer active:opacity-60"
    >
      EXPORT
    </button>
  </div>
}

<button
  type="button"
  (click)="closeRequested.emit()"
  aria-label="Close preview"
  class="absolute top-5 right-5 z-10 text-press-text-muted hover:text-press-text transition-colors duration-shift ease-run active:opacity-60 cursor-pointer"
>
  <app-icon name="close" className="w-6 h-6"></app-icon>
</button>

<div class="relative z-10 flex-1 w-full flex items-center justify-center min-h-0">
  @if (activeUrl(); as url) {
    <img
      [src]="url"
      [alt]="(activeSide() === 'export' ? 'Export' : 'Original') + (label() ? ' — ' + label() : '')"
      class="max-w-full max-h-full object-contain"
    />
  }
</div>

@if (activeCaption()) {
  <span class="relative z-10 mt-5 font-mono text-xs font-bold tracking-[0.04em] text-ink text-center bg-paper-fresh border border-paper-deckle shadow-paper-lift px-3 py-1.5">{{ activeCaption() }}</span>
}
