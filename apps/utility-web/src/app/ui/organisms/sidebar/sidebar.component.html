<nav class="space-y-6">
  <div class="px-5 pt-6">
    <h3 class="text-xs font-mono font-bold tracking-[0.04em] text-press-text-muted">TOOLS</h3>
  </div>

  <div>
    @for (tool of tools(); track tool.id) {
      <button
        type="button"
        (click)="selectedToolId.emit(tool.id)"
        [class.bg-riso-pink-pooled]="activeToolId() === tool.id"
        [class.border-l-riso-pink]="activeToolId() === tool.id"
        [class.text-press-text]="activeToolId() === tool.id"
        [class.font-bold]="activeToolId() === tool.id"
        [class.border-l-transparent]="activeToolId() !== tool.id"
        [class.text-press-text-muted]="activeToolId() !== tool.id"
        [class.hover:text-press-text]="activeToolId() !== tool.id"
        class="w-full text-left pl-[17px] pr-5 py-2.5 text-sm border-l-[3px] active:bg-press-line transition-colors duration-shift ease-run flex items-center justify-between gap-2 cursor-pointer"
      >
        <span class="truncate">{{ tool.name }}</span>
        <app-badge variant="neutral" surface="press">{{ tool.category }}</app-badge>
      </button>
    }
  </div>

  <!-- Sandbox note -->
  <div class="mx-5 border-t border-press-line pt-4 font-mono text-[0.6875rem] font-bold tracking-[0.04em] text-press-text-muted leading-relaxed">
    FILES CLEAR WHEN<br>YOU CLOSE THIS TAB
  </div>
</nav>
