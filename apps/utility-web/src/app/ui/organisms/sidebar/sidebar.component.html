<nav class="space-y-5">
  <!-- Section Header -->
  <div class="px-2">
    <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider font-mono">
      Capability Registry
    </h3>
  </div>

  <!-- Active Tools List -->
  <div class="space-y-4">
    @for (tool of tools(); track tool.id) {
      <div class="space-y-1.5">
        <!-- Category Label -->
        <div class="px-2 flex items-center justify-between text-xs text-zinc-400">
          <span class="font-medium text-zinc-300">{{ tool.name }}</span>
          <app-badge variant="neutral">{{ tool.category }}</app-badge>
        </div>

        <!-- Tool Operations -->
        <div class="space-y-1">
          @for (op of tool.operations; track op.id) {
            <button
              type="button"
              (click)="selectedOperationId.emit(op.id)"
              [class.bg-indigo-600]="activeOperationId() === op.id"
              [class.text-white]="activeOperationId() === op.id"
              [class.shadow-md]="activeOperationId() === op.id"
              [class.shadow-indigo-600/20]="activeOperationId() === op.id"
              [class.text-zinc-300]="activeOperationId() !== op.id"
              [class.hover:bg-zinc-800/80]="activeOperationId() !== op.id"
              [class.hover:text-zinc-100]="activeOperationId() !== op.id"
              class="w-full text-left px-2.5 py-2 rounded-md text-xs font-medium transition-all flex items-center justify-between group border cursor-pointer"
              [class.border-indigo-500]="activeOperationId() === op.id"
              [class.border-transparent]="activeOperationId() !== op.id"
            >
              <div class="flex items-center gap-2 truncate">
                <app-icon
                  name="image"
                  className="w-3.5 h-3.5 shrink-0 text-zinc-400"
                ></app-icon>
                <span class="truncate">{{ op.name }}</span>
              </div>
              <span
                class="text-xs font-mono px-1.5 py-0.5 rounded"
                [class.bg-indigo-700]="activeOperationId() === op.id"
                [class.text-indigo-100]="activeOperationId() === op.id"
                [class.bg-zinc-900]="activeOperationId() !== op.id"
                [class.text-zinc-400]="activeOperationId() !== op.id"
              >
                Active
              </span>
            </button>
          }
        </div>
      </div>
    }
  </div>

  <!-- Roadmap Capabilities -->
  <div class="pt-4 border-t border-zinc-800/80 px-2 space-y-2.5">
    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider font-mono">
      Planned Capabilities
    </h4>
    <div class="space-y-1.5">
      <div class="flex items-center justify-between px-2.5 py-1.5 rounded-md bg-zinc-900/40 border border-zinc-800/60 text-xs text-zinc-400">
        <div class="flex items-center gap-2">
          <app-icon name="document" className="w-3.5 h-3.5 text-zinc-400"></app-icon>
          <span>PDF (Poppler)</span>
        </div>
        <app-badge variant="neutral">M2</app-badge>
      </div>

      <div class="flex items-center justify-between px-2.5 py-1.5 rounded-md bg-zinc-900/40 border border-zinc-800/60 text-xs text-zinc-400">
        <div class="flex items-center gap-2">
          <app-icon name="clock" className="w-3.5 h-3.5 text-zinc-400"></app-icon>
          <span>Async Jobs</span>
        </div>
        <app-badge variant="neutral">M3</app-badge>
      </div>
    </div>
  </div>

  <!-- Environment Telemetry Box -->
  <div class="p-2.5 rounded-lg bg-zinc-900/60 border border-zinc-800 text-xs text-zinc-400 space-y-1.5 font-mono">
    <div class="flex justify-between items-center text-zinc-400 text-xs">
      <span>SANDBOX</span>
      <span class="text-emerald-400 font-bold">ISOLATED</span>
    </div>
    <div class="text-zinc-400 truncate text-xs" title="~/.utility/workspaces">
      ~/.utility/workspaces
    </div>
  </div>
</nav>
