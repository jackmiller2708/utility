<div class="flex flex-col gap-2">
  @for (item of items(); track item.id; let i = $index) {
    <div
      draggable="true"
      (dragstart)="onDragStart(i, $event)"
      (dragover)="onDragOver(i, $event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop(i, $event)"
      (dragend)="onDragEnd()"
      [class.border-riso-pink]="dragOverIndex() === i"
      [class.border-paper-deckle]="dragOverIndex() !== i"
      class="flex items-center gap-3 bg-paper-fresh border rounded-sm px-3 py-2.5 transition-colors"
    >
      <span class="text-ink-faint cursor-grab active:cursor-grabbing shrink-0" title="Drag to reorder">
        <app-icon name="grip" className="w-4 h-4"></app-icon>
      </span>
      <span class="text-xs font-mono font-bold tracking-[0.04em] text-ink-faint shrink-0 w-5">{{ (i + 1).toString().padStart(2, '0') }}</span>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-bold text-ink truncate" [title]="item.name">{{ item.name }}</div>
        <div class="text-xs font-mono font-bold tracking-[0.04em] text-ink-muted truncate">
          {{ item.detail ? item.detail + ' · ' : '' }}{{ item.sizeFormatted }}
        </div>
      </div>
      <app-button variant="ghost" size="sm" (clicked)="remove.emit(item.id)">
        Remove
      </app-button>
    </div>
  }
</div>
