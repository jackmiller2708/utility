@if (items().length > 0) {
  <div class="flex items-center justify-between gap-2">
    <span class="text-xs font-mono font-bold tracking-[0.04em] text-ink-muted">{{ items().length }} FILE{{ items().length === 1 ? '' : 'S' }}</span>
    <button
      type="button"
      (click)="clearAll.emit()"
      class="text-xs font-mono font-bold tracking-[0.04em] text-riso-red hover:opacity-75 active:opacity-60 transition-opacity duration-shift ease-run cursor-pointer"
    >
      CLEAR ALL
    </button>
  </div>
}

<!-- Bounded height + internal scroll: a long batch must not push the settings and submit button that follow this list off-screen. -->
<div class="flex flex-col gap-2 max-h-[280px] overflow-y-auto pr-1 -mr-1">
  @for (item of items(); track item.id; let i = $index) {
    <div
      #row
      draggable="true"
      (dragstart)="onDragStart(i, $event)"
      (dragover)="onDragOver(i, $event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop(i, $event)"
      (dragend)="onDragEnd()"
      [class.border-riso-pink]="dragOverIndex() === i"
      [class.border-paper-deckle]="dragOverIndex() !== i"
      class="flex items-center gap-3 bg-paper-fresh border rounded-sm px-3 py-2.5 transition-colors duration-shift ease-run"
    >
      <span class="text-ink-faint cursor-grab active:cursor-grabbing shrink-0" title="Drag to reorder">
        <app-icon name="grip" className="w-4 h-4"></app-icon>
      </span>
      <span class="text-xs font-mono font-bold tracking-[0.04em] text-ink-faint shrink-0 w-5">{{ (i + 1).toString().padStart(2, '0') }}</span>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-bold text-ink truncate" [title]="item.name">{{ item.name }}</div>
        <div class="text-xs font-mono font-bold tracking-[0.04em] text-ink-muted truncate">
          {{ item.detail ? item.detail + ' · ' : '' }}{{ item.sizeFormatted }}
        </div>
      </div>
      <app-button variant="ghost" size="sm" (clicked)="remove.emit(item.id)">
        Remove
      </app-button>
    </div>
  }
</div>
