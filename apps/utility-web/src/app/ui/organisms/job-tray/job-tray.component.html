@if (jobs().length > 0) {
  <div class="w-full border-t border-press-line">
    <button
      type="button"
      (click)="toggle()"
      class="w-full flex items-center justify-center gap-2 py-2.5 font-mono text-xs font-bold tracking-[0.04em] text-press-text-muted hover:text-press-text active:bg-press-line transition-colors duration-shift ease-run cursor-pointer"
      [attr.aria-expanded]="expanded()"
      aria-label="Toggle job tray"
    >
      <span class="w-1.5 h-1.5 rounded-full shrink-0" [class.bg-riso-gold]="activeCount() > 0" [class.pulse-slow]="activeCount() > 0" [class.bg-riso-mint]="activeCount() === 0"></span>
      <span class="text-optical-center">
        @if (activeCount() > 0) {
          {{ activeCount() }} JOB{{ activeCount() === 1 ? '' : 'S' }} RUNNING
        } @else {
          {{ jobs().length }} JOB{{ jobs().length === 1 ? '' : 'S' }}
        }
      </span>
      <app-icon name="chevron" className="w-3 h-3 transition-transform duration-shift ease-run" [class.rotate-180]="expanded()"></app-icon>
    </button>

    @if (expanded()) {
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
        @for (entry of entries(); track (entry.kind === 'batch' ? entry.batchId : entry.job.ticketId); let i = $index) {
          @if (entry.kind === 'job') {
            <app-job-ticket
              [job]="entry.job"
              [index]="i"
              [compact]="true"
              [leaving]="isLeaving(entry.job.id)"
              (cancelled)="cancelJob.emit($event)"
              (dismissed)="requestDismiss($event)"
              (leftView)="onLeftView(entry.job.id)"
            ></app-job-ticket>
          } @else {
            <app-batch-ticket
              [jobs]="entry.jobs"
              [index]="i"
              (cancelled)="cancelBatch.emit(entry.batchId)"
              (dismissed)="dismissBatch.emit(entry.batchId)"
              (jobCancelled)="cancelJob.emit($event)"
            ></app-batch-ticket>
          }
        }
      </div>
    }
  </div>
}
