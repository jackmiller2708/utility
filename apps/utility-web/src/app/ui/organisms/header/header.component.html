<header class="flex-none bg-press-elevated border-b border-press-line sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[60px] flex items-center gap-5 flex-wrap">
    <!-- Masthead -->
    <div class="flex items-baseline gap-2.5">
      <span class="text-[1.375rem] font-black tracking-[-0.01em] leading-none text-press-text">UTILITY</span>
      <span class="font-mono text-xs font-bold tracking-[0.04em] text-press-text-muted">IMAGES</span>
      <app-badge variant="neutral" surface="press">v0.1.0</app-badge>
    </div>

    <div class="flex-1"></div>

    <!-- Runtime status -->
    <div class="flex items-center gap-3">
      @if (authStatus(); as auth) {
        <div class="flex items-center gap-2 px-3 py-1.5 text-xs font-mono">
          <span class="w-2 h-2 rounded-full bg-riso-mint" style="animation: ink-pulse 2s ease-in-out infinite"></span>
          <span class="font-bold tracking-[0.04em] text-press-text">
            {{ auth.isLocal ? 'LOCALHOST' : 'AUTHENTICATED' }}
          </span>
          <span class="text-press-text-muted hidden md:inline border-l border-press-line pl-2">
            {{ auth.device?.deviceId ? (auth.device.deviceId.slice(0, 8) + '…') : '127.0.0.1' }}
          </span>
        </div>
      } @else {
        <div class="flex items-center gap-2 px-3 py-1.5 text-xs font-mono">
          <span class="w-2 h-2 rounded-full bg-riso-gold" style="animation: ink-pulse 1.2s ease-in-out infinite"></span>
          <span class="font-bold tracking-[0.04em] text-press-text-muted">CONNECTING&hellip;</span>
        </div>
      }
    </div>
  </div>
</header>
