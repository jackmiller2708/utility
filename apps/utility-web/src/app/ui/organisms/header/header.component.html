<header class="border-b border-zinc-800 bg-[#09090b]/90 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-15 flex items-center justify-between">
    <!-- Logo & Workstation Identity -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-zinc-900 flex items-center justify-center text-indigo-400 font-mono font-bold text-sm border border-zinc-700/80">
        <app-icon name="bolt" className="w-4 h-4"></app-icon>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold text-zinc-100 tracking-tight text-sm sm:text-base">Utility Platform</span>
          <app-badge variant="neutral">v0.1.0</app-badge>
        </div>
        <p class="text-xs text-zinc-400 font-mono tracking-tight hidden sm:block">Local Capability Runtime &middot; Linux Native</p>
      </div>
    </div>

    <!-- Capability Runtime Status & Telemetry -->
    <div class="flex items-center gap-3">
      @if (authStatus(); as auth) {
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-[#121215] border border-zinc-800 text-xs">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-zinc-200 font-medium">
            {{ auth.isLocal ? 'Localhost Engine' : 'Authenticated Node' }}
          </span>
          <span class="text-xs font-mono text-zinc-400 hidden md:inline border-l border-zinc-800 pl-2">
            {{ auth.device?.deviceId ? (auth.device.deviceId.slice(0, 8) + '…') : '127.0.0.1' }}
          </span>
        </div>
      } @else {
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-[#121215] border border-zinc-800 text-xs text-zinc-400">
          <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span>Connecting to Runtime...</span>
        </div>
      }
    </div>
  </div>
</header>
