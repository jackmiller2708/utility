<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[60px] flex items-center gap-5 flex-wrap">
  <!-- Masthead -->
  <div class="flex items-center gap-[11px]">
    <app-brand-mark [size]="22" variant="reversed" />
    <div class="flex items-baseline gap-2.5">
      <span class="text-[1.375rem] font-black tracking-[-0.01em] leading-none text-press-text">UTILITY</span>
      @if (sectionLabel()) {
        <span class="font-mono text-xs font-bold tracking-[0.04em] text-press-text-muted">{{ sectionLabel() }}</span>
      }
    </div>
  </div>

  <div class="flex-1"></div>

  <!-- Status -->
  <div class="flex items-center gap-3">
    @if (activeJobCount() > 0) {
      <button
        type="button"
        (click)="jobTrayToggled.emit()"
        class="flex items-center gap-2 px-3 py-1.5 text-xs font-mono rounded-sm hover:bg-press active:bg-press-line cursor-pointer transition-colors duration-shift ease-run"
        aria-label="Show running jobs"
      >
        <span class="relative w-2 h-2 rounded-full bg-riso-gold shrink-0 pulse-slow"></span>
        <span class="font-bold pt-[4.5px] leading-none tracking-[0.04em] text-press-text">{{ activeJobCount() }} RUNNING</span>
      </button>
    }

    <button
      type="button"
      (click)="devicesClicked.emit()"
      class="flex items-center gap-2 px-3 py-1.5 text-xs font-mono rounded-sm hover:bg-press active:bg-press-line cursor-pointer transition-colors duration-shift ease-run"
      [attr.aria-label]="deviceTrust.trusted() === 'trusted' ? 'This device is trusted — open Devices' : 'This device is not trusted — open Devices'"
      title="Devices"
    >
      @switch (deviceTrust.trusted()) {
        @case ('trusted') {
          <span class="relative w-2 h-2 rounded-full bg-riso-mint shrink-0"></span>
          <span class="font-bold pt-[4.5px] leading-none tracking-[0.04em] text-press-text">TRUSTED</span>
        }
        @case ('checking') {
          <span class="relative w-2 h-2 rounded-full bg-riso-gold shrink-0 pulse-fast"></span>
          <span class="font-bold pt-[4.5px] leading-none tracking-[0.04em] text-press-text-muted">CONNECTING&hellip;</span>
        }
        @case ('pending') {
          <span class="relative w-2 h-2 rounded-full bg-riso-gold shrink-0 pulse-slow"></span>
          <span class="font-bold pt-[4.5px] leading-none tracking-[0.04em] text-press-text-muted">WAITING FOR APPROVAL</span>
        }
        @default {
          <span class="relative w-2 h-2 rounded-full bg-riso-red shrink-0"></span>
          <span class="font-bold pt-[4.5px] leading-none tracking-[0.04em] text-press-text-muted">NOT TRUSTED</span>
        }
      }
    </button>
  </div>
</div>
