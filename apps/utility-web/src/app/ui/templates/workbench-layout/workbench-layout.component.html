<app-ink-atmosphere></app-ink-atmosphere>

<app-header
  [activeJobCount]="jobTracker.activeCount()"
  [sectionLabel]="sectionLabel()"
  (jobTrayToggled)="tray.expanded.set(true)"
  (devicesClicked)="devicesSelected.emit()"
></app-header>

<div class="relative z-10 flex-1 flex items-stretch flex-wrap">
  <app-sidebar
    [tools]="tools()"
    [activeToolId]="activeToolId()"
    [onRecentRoute]="onRecentRoute()"
    [onRecipesRoute]="onRecipesRoute()"
    [onDevicesRoute]="onDevicesRoute()"
    (selectedToolId)="toolSelected.emit($event)"
    (recentSelected)="recentSelected.emit()"
    (recipesSelected)="recipesSelected.emit()"
    (devicesSelected)="devicesSelected.emit()"
  ></app-sidebar>

  <main class="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-7 pb-12">
    <div class="max-w-7xl mx-auto">
      <ng-content></ng-content>
    </div>
  </main>
</div>

<footer class="relative z-10 flex-none bg-press-elevated border-t border-press-line">
  <app-job-tray
    #tray
    [jobs]="jobTracker.jobs()"
    (cancelJob)="jobTracker.cancel($event)"
    (dismissJob)="jobTracker.dismiss($event)"
    (cancelBatch)="jobTracker.cancelBatch($event)"
    (dismissBatch)="jobTracker.dismissBatch($event)"
  ></app-job-tray>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-center gap-2 font-mono text-xs font-bold tracking-[0.04em] text-press-text-muted">
    <span class="relative w-1.5 h-1.5 rounded-full bg-riso-pink shrink-0"></span>
    <span class="leading-none pt-[4.5px]">Utility &middot; Your files stay private &mdash; nothing uploads to the cloud</span>
  </div>
</footer>

@if (lightroom.request(); as request) {
  <app-lightroom
    [initialSide]="request.initialSide"
    [originalUrl]="request.originalUrl"
    [exportUrl]="request.exportUrl"
    [originalCaption]="request.originalCaption"
    [exportCaption]="request.exportCaption"
    [label]="request.label"
    [leaving]="lightroom.leaving()"
    (closeRequested)="lightroom.close()"
    (leftView)="lightroom.onLeftView()"
  ></app-lightroom>
}
