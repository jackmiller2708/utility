<div class="min-h-screen bg-press text-press-text flex flex-col font-sans">
  <app-header [authStatus]="authStatus()"></app-header>

  <div class="flex-1 flex items-stretch flex-wrap">
    <aside class="flex-none w-full lg:w-[240px] bg-press border-b lg:border-b-0 lg:border-r border-press-line">
      <app-sidebar
        [tools]="tools()"
        [activeOperationId]="activeOperationId()"
        (selectedOperationId)="operationSelected.emit($event)"
      ></app-sidebar>
    </aside>

    <main class="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-7 pb-12">
      <div class="max-w-7xl mx-auto">
        <ng-content></ng-content>
      </div>
    </main>
  </div>

  <footer class="flex-none bg-press-elevated border-t border-press-line py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 font-mono text-xs font-bold tracking-[0.04em] text-press-text-muted">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-riso-pink"></span>
        <span>Utility Platform</span>
        <span>&middot;</span>
        <span>Private Capability Runtime</span>
      </div>
      <div>Angular 22 &middot; NestJS 12 &middot; Effect Schema &middot; Sharp 0.34</div>
    </div>
  </footer>
</div>
