<div class="min-h-screen bg-[#09090b] text-zinc-100 flex flex-col font-sans selection:bg-indigo-500/30 selection:text-indigo-200">
  <!-- Top Navigation Header Organism -->
  <app-header [authStatus]="authStatus()"></app-header>

  <!-- Main Workbench Body Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Left Capability Sidebar Organism (3 cols) -->
      <aside class="lg:col-span-3">
        <div class="sticky top-20 bg-[#121215] border border-zinc-800 rounded-xl p-3.5 shadow-sm">
          <app-sidebar
            [tools]="tools()"
            [activeOperationId]="activeOperationId()"
            (selectedOperationId)="operationSelected.emit($event)"
          ></app-sidebar>
        </div>
      </aside>

      <!-- Main Dynamic Canvas (9 cols) -->
      <section class="lg:col-span-9">
        <div class="bg-[#121215]/80 border border-zinc-800 rounded-xl p-5 sm:p-6 shadow-lg backdrop-blur-sm min-h-[500px]">
          <ng-content></ng-content>
        </div>
      </section>
    </div>
  </main>

  <!-- Workstation Telemetry Footer -->
  <footer class="border-t border-zinc-800/80 bg-[#09090b] py-4 text-xs text-zinc-400 font-mono">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
        <span class="font-medium text-zinc-400 font-sans">Utility Platform</span>
        <span class="text-zinc-600">&middot;</span>
        <span class="text-zinc-400 text-xs">Private Capability Runtime</span>
      </div>
      <div class="text-xs text-zinc-400">
        Angular 22 &middot; NestJS 12 &middot; Effect Schema &middot; Sharp 0.34
      </div>
    </div>
  </footer>
</div>
