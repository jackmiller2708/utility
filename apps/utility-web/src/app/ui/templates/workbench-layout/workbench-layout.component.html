<app-header
  [authStatus]="authStatus()"
  [activeJobCount]="jobTracker.activeCount()"
  (jobTrayToggled)="tray.expanded.set(true)"
></app-header>

<div class="flex-1 flex items-stretch flex-wrap">
  <app-sidebar
    [tools]="tools()"
    [activeToolId]="activeToolId()"
    [onRecentRoute]="onRecentRoute()"
    [onRecipesRoute]="onRecipesRoute()"
    (selectedToolId)="toolSelected.emit($event)"
    (recentSelected)="recentSelected.emit()"
    (recipesSelected)="recipesSelected.emit()"
  ></app-sidebar>

  <main class="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-7 pb-12">
    <div class="max-w-7xl mx-auto">
      <ng-content></ng-content>
    </div>
  </main>
</div>

<footer class="flex-none bg-press-elevated border-t border-press-line">
  <app-job-tray
    #tray
    [jobs]="jobTracker.jobs()"
    (cancelJob)="jobTracker.cancel($event)"
    (dismissJob)="jobTracker.dismiss($event)"
    (cancelBatch)="jobTracker.cancelBatch($event)"
    (dismissBatch)="jobTracker.dismissBatch($event)"
  ></app-job-tray>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-center gap-2 font-mono text-xs font-bold tracking-[0.04em] text-press-text-muted">
    <span class="w-1.5 h-1.5 rounded-full bg-riso-pink shrink-0"></span>
    <span class="leading-none">Utility &middot; Your files stay private &mdash; nothing uploads to the cloud</span>
  </div>
</footer>
