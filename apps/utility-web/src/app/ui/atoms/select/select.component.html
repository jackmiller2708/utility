<div class="relative w-full">
  <select
    [id]="id() || null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || null"
    [value]="value()"
    [disabled]="disabled()"
    (change)="onChange($event)"
    class="peer w-full min-w-0 max-w-full px-3 py-2.5 bg-paper-fresh border border-paper-deckle border-b-2 border-b-ink focus:border-riso-pink rounded-sm text-sm font-bold text-ink outline-none transition-colors duration-shift ease-run cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    @for (opt of options(); track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
  <span class="reg-cross absolute top-1.5 right-6 text-riso-pink opacity-0 peer-focus:opacity-100 transition-opacity duration-shift ease-run pointer-events-none"></span>
</div>
