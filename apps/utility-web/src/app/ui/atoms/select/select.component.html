<select
  [id]="id() || null"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-labelledby]="ariaLabelledby() || null"
  [value]="value()"
  [disabled]="disabled()"
  (change)="onChange($event)"
  class="w-full px-3 py-2 bg-[#09090b] border border-zinc-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 rounded-lg text-xs text-zinc-200 outline-none transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
>
  @for (opt of options(); track opt.value) {
    <option [value]="opt.value">{{ opt.label }}</option>
  }
</select>
