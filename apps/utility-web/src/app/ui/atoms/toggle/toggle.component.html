<label class="flex items-start gap-2.5 cursor-pointer select-none" [class.opacity-50]="disabled()">
  <input
    type="checkbox"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange($event)"
    class="mt-0.5 rounded border-zinc-700 bg-zinc-900 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
  />
  <span class="text-xs text-zinc-300 leading-tight">
    {{ label() }}
  </span>
</label>
