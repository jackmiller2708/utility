<label class="flex items-start gap-2.5 cursor-pointer select-none transition-opacity duration-shift ease-run" [class.opacity-50]="disabled()">
  <input
    type="checkbox"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange($event)"
    class="w-4 h-4 mt-0.5 rounded-sm border border-paper-deckle bg-paper-fresh accent-riso-pink cursor-pointer shrink-0"
  />
  <span class="flex-1 min-w-0">
    <span class="block text-sm font-bold leading-relaxed text-ink">{{ label() }}</span>
    @if (description()) {
      <span class="block text-sm leading-relaxed text-ink-muted">{{ description() }}</span>
    }
  </span>
</label>
