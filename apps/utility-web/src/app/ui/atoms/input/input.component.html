<div class="relative w-full">
  <input
    [id]="id() || null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || null"
    [type]="type()"
    [value]="value() ?? ''"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    [class.font-mono]="mono()"
    [class.pr-8]="unitSuffix() !== ''"
    class="w-full pl-3 py-2 bg-zinc-950 border border-zinc-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 rounded-lg text-xs text-zinc-100 placeholder-zinc-500 outline-none transition-all disabled:opacity-50 disabled:cursor-not-allowed"
  />
  @if (unitSuffix()) {
    <span class="absolute right-2.5 top-2 text-xs font-mono text-zinc-500 pointer-events-none">
      {{ unitSuffix() }}
    </span>
  }
</div>
