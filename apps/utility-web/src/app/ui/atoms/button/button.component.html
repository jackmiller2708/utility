<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  (click)="clicked.emit($event)"
  [class.px-3]="size() === 'sm'"
  [class.py-1.5]="size() === 'sm'"
  [class.text-xs]="size() === 'sm'"
  [class.px-[18px]]="size() === 'md'"
  [class.py-2.5]="size() === 'md'"
  [class.text-sm]="size() === 'md' || size() === 'lg'"
  [class.px-[22px]]="size() === 'lg'"
  [class.py-3]="size() === 'lg'"
  [class.bg-riso-pink]="variant() === 'primary'"
  [class.hover:bg-riso-pink-hover]="variant() === 'primary'"
  [class.bg-riso-mint]="variant() === 'success'"
  [class.text-ink]="variant() === 'primary' || variant() === 'success'"
  [class.font-extrabold]="variant() === 'primary' || variant() === 'success'"
  [class.bg-transparent]="variant() === 'secondary' || variant() === 'ghost'"
  [class.border-riso-blue]="variant() === 'secondary'"
  [class.text-riso-blue]="variant() === 'secondary'"
  [class.hover:bg-riso-blue]="variant() === 'secondary'"
  [class.hover:text-paper-fresh]="variant() === 'secondary'"
  [class.text-ink-faint]="variant() === 'ghost'"
  [class.hover:text-ink]="variant() === 'ghost'"
  [class.border-transparent]="variant() !== 'secondary'"
  class="inline-flex items-center justify-center gap-2 rounded-sm font-bold border-2 transition-colors cursor-pointer max-w-full min-w-0 disabled:opacity-45 disabled:cursor-not-allowed active:shadow-stamped"
>
  @if (loading()) {
    <span class="reg-cross reg-cross-spin"></span>
  }
  <ng-content></ng-content>
</button>
