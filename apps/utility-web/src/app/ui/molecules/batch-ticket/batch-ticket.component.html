<div class="w-full flex items-center gap-2">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="expanded()"
    aria-label="Toggle batch details"
    class="flex items-center gap-3 flex-1 min-w-0 text-left cursor-pointer"
  >
    <span class="shrink-0 flex items-center justify-center w-5 h-5 mt-0.5">
      @if (isActive()) {
        <span class="reg-cross reg-cross-spin text-riso-pink"></span>
      } @else if (failedCount() > 0) {
        <app-icon name="close" className="w-4 h-4 text-riso-red"></app-icon>
      } @else {
        <app-icon name="check" className="w-4 h-4 text-riso-mint"></app-icon>
      }
    </span>

    <span class="min-w-0 flex-1 flex flex-col gap-0.5">
      <span class="text-xs font-bold text-ink truncate capitalize">{{ operationLabel() }} &times;{{ total() }}</span>
      <span class="font-mono text-xs font-bold tracking-[0.04em] text-ink-muted">
        {{ completedCount() }} / {{ total() }} done
        @if (failedCount() > 0) {
          <span class="text-riso-red"> &middot; {{ failedCount() }} failed</span>
        }
      </span>
    </span>

    <app-icon
      name="chevron"
      className="w-3 h-3 shrink-0 text-ink-faint transition-transform duration-shift ease-run"
      [class.rotate-180]="expanded()"
    ></app-icon>
  </button>

  @if (isActive()) {
    <button
      type="button"
      (click)="cancelled.emit()"
      class="shrink-0 text-ink-faint hover:text-riso-red transition-colors duration-shift ease-run cursor-pointer active:opacity-60"
      aria-label="Cancel batch"
      title="Cancel all"
    >
      <app-icon name="close" className="w-3.5 h-3.5"></app-icon>
    </button>
  } @else {
    <button
      type="button"
      (click)="dismissed.emit()"
      class="shrink-0 text-ink-faint hover:text-ink transition-colors duration-shift ease-run cursor-pointer active:opacity-60"
      aria-label="Dismiss batch"
      title="Dismiss"
    >
      <app-icon name="close" className="w-3.5 h-3.5"></app-icon>
    </button>
  }
</div>

@if (expanded()) {
  <div class="mt-2 pt-2 border-t border-paper-hairline flex flex-col gap-1.5">
    @for (job of jobs(); track job.id; let i = $index) {
      <app-job-ticket [job]="job" [index]="i" [compact]="true" (cancelled)="jobCancelled.emit($event)"></app-job-ticket>
    }
  </div>
}
