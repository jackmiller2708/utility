<div class="bg-paper-fresh border border-paper-deckle rounded-sm p-3.5 flex items-center gap-3.5">
  <div class="w-11 h-11 rounded-sm overflow-hidden border border-paper-deckle shrink-0 flex items-center justify-center bg-[repeating-linear-gradient(45deg,#E7DFC8_0,#E7DFC8_3px,#FCF8ED_3px,#FCF8ED_6px)]">
    @if (previewUrl()) {
      <img [src]="previewUrl()!" alt="File preview" class="w-full h-full object-cover" />
    }
  </div>
  <div class="flex-1 min-w-0">
    <div class="font-bold text-ink text-sm truncate">
      {{ name() }}
    </div>
    <div class="text-xs font-mono font-bold tracking-[0.04em] text-ink-muted mt-0.5 truncate flex items-center gap-1.5">
      @if (loading()) {
        <span class="reg-cross reg-cross-spin text-riso-pink shrink-0"></span>
      }
      @if (dimensions()) {
        <span>{{ dimensions() }} &middot;</span>
      }
      <span>{{ sizeFormatted() }}</span>
    </div>
  </div>
  <app-button variant="ghost" size="sm" (clicked)="requestRemoval()">
    Remove
  </app-button>
</div>

@if (confirmingRemoval()) {
  <div #removalAlert class="mt-4 bg-paper-fresh border border-riso-red rounded-sm p-4" role="alertdialog">
    <div class="text-sm font-bold text-ink">Remove this {{ itemLabel() }}?</div>
    <div class="text-sm leading-relaxed text-ink-muted mt-1">
      Any results go with it. You can drop the {{ itemLabel() }} back in any time.
    </div>
    <div class="flex gap-2 mt-3.5">
      <button
        type="button"
        (click)="confirmRemoval()"
        class="bg-riso-red text-paper-fresh rounded-sm px-4 py-2 text-sm font-bold cursor-pointer hover:opacity-90 active:shadow-stamped transition-opacity duration-shift ease-run"
      >
        Remove
      </button>
      <button
        type="button"
        (click)="cancelRemoval()"
        class="bg-transparent text-ink-muted rounded-sm px-4 py-2 text-sm font-bold cursor-pointer hover:text-ink active:opacity-60 transition-colors duration-shift ease-run"
      >
        Keep it
      </button>
    </div>
  </div>
}
