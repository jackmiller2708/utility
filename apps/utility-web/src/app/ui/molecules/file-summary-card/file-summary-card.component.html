<div class="bg-paper-fresh border border-paper-deckle rounded-sm p-3.5 flex items-center gap-3.5">
  <div class="w-11 h-11 rounded-sm overflow-hidden border border-paper-deckle shrink-0 flex items-center justify-center bg-[repeating-linear-gradient(45deg,#E7DFC8_0,#E7DFC8_3px,#FCF8ED_3px,#FCF8ED_6px)]">
    @if (previewUrl()) {
      <img [src]="previewUrl()!" alt="File preview" class="w-full h-full object-cover" />
    }
  </div>
  <div class="flex-1 min-w-0">
    <div class="font-bold text-ink text-sm truncate">
      {{ name() }}
    </div>
    <div class="text-xs font-mono font-bold tracking-[0.04em] text-ink-muted mt-0.5 truncate">
      {{ dimensions() }} &middot; {{ sizeFormatted() }}
    </div>
  </div>
  <app-button variant="ghost" size="sm" (clicked)="requestRemoval()">
    Remove
  </app-button>
</div>

@if (confirmingRemoval()) {
  <div class="mt-4 bg-paper-fresh border border-riso-red rounded-sm p-4" role="alertdialog">
    <div class="text-sm font-bold text-ink">Remove this image?</div>
    <div class="text-sm leading-relaxed text-ink-muted mt-1">
      The export goes with it. You can drop the image back in any time.
    </div>
    <div class="flex gap-2 mt-3.5">
      <button
        type="button"
        (click)="confirmRemoval()"
        class="bg-riso-red text-paper-fresh rounded-sm px-4 py-2 text-sm font-bold cursor-pointer active:shadow-stamped"
      >
        Remove
      </button>
      <button
        type="button"
        (click)="cancelRemoval()"
        class="bg-transparent text-ink-muted rounded-sm px-4 py-2 text-sm font-bold cursor-pointer hover:text-ink"
      >
        Keep it
      </button>
    </div>
  </div>
}
