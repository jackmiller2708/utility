<div class="min-w-0">
  @if (heading()) {
    <div class="text-xs font-mono font-bold tracking-[0.04em] text-ink-muted mb-2.5">{{ heading() }}</div>
  }
  <div class="flex gap-2 flex-wrap">
    @for (tile of tiles(); track tile.id) {
      <button
        type="button"
        (click)="selectTile(tile.id, $event)"
        [class.bg-riso-pink]="activeId() === tile.id && activeInk() === 'pink'"
        [class.border-riso-pink]="activeId() === tile.id && activeInk() === 'pink'"
        [class.bg-riso-blue]="activeId() === tile.id && activeInk() === 'blue'"
        [class.border-riso-blue]="activeId() === tile.id && activeInk() === 'blue'"
        [class.text-paper-fresh]="activeId() === tile.id && activeInk() === 'blue'"
        [class.text-ink]="!(activeId() === tile.id && activeInk() === 'blue')"
        [class.bg-paper-fresh]="activeId() !== tile.id"
        [class.border-paper-deckle]="activeId() !== tile.id"
        class="px-3 py-2 text-xs font-mono font-bold tracking-[0.04em] rounded-sm border cursor-pointer transition-colors duration-shift ease-run active:shadow-stamped"
      >
        {{ tile.label }}
      </button>
    }
  </div>
</div>
