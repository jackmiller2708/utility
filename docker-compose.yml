services:
  api:
    build:
      context: .
      dockerfile: apps/utility-api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGINS: https://${LAN_HOSTNAME:-utility.home.arpa},https://${TAILSCALE_HOSTNAME}
    volumes:
      # Runs as the image's non-root "node" user (uid/gid 1000), whose home
      # is /home/node -- job/device state lives under $HOME/.utility.
      - utility-state:/home/node/.utility
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      # Docker's default json-file driver has no size cap out of the box --
      # without this, stdout logs (Nest's request/error logging) would grow
      # unbounded on disk for as long as the container runs. `docker compose
      # logs -f api` still tails the rotated files transparently.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - internal
    restart: unless-stopped
    # Exactly one instance: job state and the device-auth nonce-replay cache
    # are held in-memory in this process (no database/Redis), so a second
    # replica would desync job status and replay protection. Do not scale
    # this service.

  web:
    build:
      context: .
      dockerfile: apps/utility-web/Dockerfile
    environment:
      PORT: 4000
      # Angular SSR rejects requests with an unrecognized Host header (SSRF
      # protection) and ignores X-Forwarded-* headers unless explicitly
      # trusted — both required for it to work behind Caddy on the LAN
      # hostname. See https://angular.dev/best-practices/security#preventing-server-side-request-forgery-ssrf
      NG_ALLOWED_HOSTS: ${LAN_HOSTNAME:-utility.home.arpa},${TAILSCALE_HOSTNAME}
      NG_TRUST_PROXY_HEADERS: x-forwarded-host,x-forwarded-proto,x-forwarded-for
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - internal
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Bounds Prometheus's own on-disk TSDB the same way artifacts/jobs are bounded
      # elsewhere -- otherwise it's a third unbounded-growth store on this host.
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - internal
    restart: unless-stopped
    # No `ports:` and no Caddy route -- reachable only from other containers on the
    # `internal` network (Grafana). It has no auth of its own, so it never gets a
    # route on either Caddy listener (LAN or the public Tailscale Funnel).

  grafana:
    image: grafana/grafana:13.0.2
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_ADMIN_PASSWORD in .env before first boot -- this only supplies the
      # bootstrap default and Grafana won't re-apply it once the admin account exists.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://${LAN_HOSTNAME:-utility.home.arpa}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - internal
    restart: unless-stopped
    # Routed by Caddy's LAN block only (see Caddyfile) -- not the :8443 Tailscale
    # Funnel block -- so it's reachable from the home network but not the public
    # internet. Revisit GF_SECURITY_ADMIN_PASSWORD if that ever changes.

  caddy:
    image: caddy:2
    depends_on:
      - api
      - web
      - grafana
    environment:
      LAN_HOSTNAME: ${LAN_HOSTNAME:-utility.home.arpa}
    ports:
      # Bound to the LAN IP specifically (from .env, not hardcoded — see
      # LAN_IP there), not 0.0.0.0: publishing to every interface would also
      # grab port 443 on the Tailscale interface, which `tailscaled` needs
      # free for its own Funnel HTTPS listener (see
      # docs/tailscale-funnel-setup.md). Get a DHCP reservation for this host
      # to stop LAN_IP from drifting; until then, update it in .env whenever
      # the address changes.
      - "${LAN_IP}:80:80"
      - "${LAN_IP}:443:443"
      # Loopback-only — reached solely by the host's native `tailscale`
      # daemon proxying Funnel traffic in (see docs/tailscale-funnel-setup.md).
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Caddy stays root (its official image expects to be) and binds :80/
      # :443 inside the container -- with all other caps dropped, it needs
      # this one back to bind those privileged ports.
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    networks:
      - internal
    restart: unless-stopped
    # caddy_data persists the internal CA root certificate across restarts —
    # losing it would force re-trusting a new CA on every client device.

networks:
  internal:

volumes:
  utility-state:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
